services:
  # Member 2: Local Midnight Proof Server (generates ZK proofs locally; private data never leaves the device)
  midnight-proof-server:
    image: ${MIDNIGHT_PROOF_SERVER_IMAGE:-midnightnetwork/proof-server:latest}
    container_name: veil402-midnight-proof-server
    ports:
      - "6300:6300"
    command: ["midnight-proof-server", "--network", "${MIDNIGHT_NETWORK:-testnet}"]
    restart: unless-stopped
    profiles: ["midnight", "full"]

  # Member 1 & Member 4 will attach Dockerfile builds for `api-gateway` and `web`
  # under the `full` profile before the clean-machine judge test on Dec 13.
